##################################
#      Static Server Entries     #
##################################

## Static entries are servers that are explicitly defined here, rather than
## discovered from sources.

# [static]
# [static.'myserver']
# stamp = 'sdns://...'

## Example: Cloudflare DNS over HTTPS
# [static.'cloudflare']
# stamp = 'sdns://AgcAAAAAAAAABzEuMC4wLjEAEmRucy5jbG91ZGZsYXJlLmNvbQovZG5zLXF1ZXJ5'

## Example: Google DNS over HTTPS
# [static.'google']
# stamp = 'sdns://AgUAAAAAAAAAACAe9iTP_15r07rd8_3b_epWVGfjdymdx-5mdRZvMAzBuQ5kbnMuZ29vZ2xlLmNvbQ0vZXhwZXJpbWVudGFs'


##################################
#      Servers Configuration     #
##################################

## List of the names of servers to use (optional).
## If not specified, all servers matching the requirements will be used.
## The proxy will automatically pick the fastest servers from the list.

# server_names = ['cloudflare', 'google', 'quad9-dnscrypt-ip4-filter-pri']


##################################
#      Broken Implementations    #
##################################

## Some networks and devices are known to have broken implementations
## that don't support specific features or standards properly.

## Disable IPv6 probing (useful for networks that have IPv6 partially broken)
# ipv6_probing = true

## Use TCP instead of UDP for outgoing queries
## Can help with some broken home routers/devices
# force_tcp = false


##################################
#      Additional Options        #
##################################

## Maximum log files size in MB - Set to 0 for unlimited.
# log_files_max_size = 10

## How long to keep backup files, in days
# log_files_max_age = 7

## Maximum log files backups to keep (or 0 to keep all backups)
# log_files_max_backups = 1
