##############################################
#                                            #
#        DNSCrypt-Proxy Configuration        #
#                                            #
##############################################

## This is a comprehensive dnscrypt-proxy configuration
## Docs: https://github.com/DNSCrypt/dnscrypt-proxy/wiki/Configuration


##################################
#        Server settings         #
##################################

## List of local addresses and ports to listen to. Can be IPv4 and/or IPv6.
listen_addresses = ['0.0.0.0:5053', '[::1]:53']

## Maximum number of simultaneous client connections to accept
max_clients = 250

## Switch to a different system user after listening sockets have been created.
## Note (1): this feature is currently unsupported on Windows.
## Note (2): this feature is not compatible with systemd socket activation.
## Note (3): when using -pidfile, the PID file directory must be writable by the new user
# user_name = 'nobody'


##################################
#        Server Selection        #
##################################

## Use servers reachable over IPv4
ipv4_servers = true

## Use servers reachable over IPv6
ipv6_servers = true

## Use servers implementing the DNSCrypt protocol
dnscrypt_servers = true

## Use servers implementing the DNS-over-HTTPS protocol
doh_servers = true

## Use servers implementing the Oblivious DoH protocol
odoh_servers = false

## Require servers to support DNSSEC
require_dnssec = true

## Server must not log user queries (declarative)
require_nolog = true

## Server must not enforce its own blocklist (declarative)
require_nofilter = true

## Server names to avoid even if they match all criteria
# disabled_server_names = []


##################################
#         DNS settings           #
##################################

## Always use TCP to connect to upstream servers.
## This can be useful if you need to route everything through Tor.
## Otherwise, leave this to `false`, as it doesn't improve security
## (dnscrypt-proxy will always encrypt everything even using UDP), and can
## only increase latency.
force_tcp = false

## Timeout for DNS queries, in milliseconds
timeout = 5000

## Keepalive for HTTP (HTTPS, HTTP/2) queries, in seconds
keepalive = 30

## Load-balancing strategy: 'p2' (default), 'ph', 'first' or 'random'
## - 'p2': pick the two fastest servers and use the fastest one
## - 'ph': p2 with priority to servers with better health
## - 'first': use the first server available in the list
## - 'random': pick a random server from the list
lb_strategy = 'p2'

## Load-balancing estimator: 'ewma' (default) or 'filtered'
lb_estimator = 'ewma'

## Log level (0-6, default: 2 - 0 is very verbose, 6 is just errors)
log_level = 2

## Log file for the application, omit to log to stdout
# log_file = 'dnscrypt-proxy.log'

## Use the system logger (syslog on Unix, Event Log on Windows)
# use_syslog = true


##################################
#        Network settings        #
##################################

## Fallback resolvers - These are normal, non-encrypted DNS resolvers, that will be only used
## for one-shot queries when retrieving the initial resolvers list, and only if
## the system DNS configuration doesn't work.
fallback_resolvers = ['9.9.9.9:53', '1.1.1.1:53']

## Always use fallback resolver (bootstrap_resolvers)
ignore_system_dns = true

## Bootstrap resolvers - These resolvers will be used for initial queries
bootstrap_resolvers = ['9.9.9.11:53', '1.1.1.1:53']

## Maximum time (in seconds) to wait for network connectivity before
## initializing the proxy.
## Useful if the proxy is automatically started at boot, and network
## connectivity is not guaranteed to be immediately available.
netprobe_timeout = 60

## Address and port to try initializing a connection to, just to check
## if the network is up. It can be any address and any port, even if
## there is nothing answering these on the other side.
netprobe_address = '9.9.9.9:53'

## Offline mode - Do not use any remote encrypted servers.
## The proxy will remain fully functional to respond to queries that
## plugins can handle directly (forwarding, cloaking, ...)
offline_mode = false


##################################
#         Filtering              #
##################################

## Immediately respond to IPv6-related queries with an empty response
## This makes things faster when there is no IPv6 connectivity, but can
## also cause reliability issues with some stub resolvers.
block_ipv6 = false

## Immediately respond to A and AAAA queries for host names without a domain name
block_unqualified = true

## Immediately respond to queries for local zones instead of leaking them to
## upstream resolvers (always causing errors or timeouts).
block_undelegated = true

## TTL for synthetic responses sent when a request has been blocked (due to
## IPv6 or blocklists).
reject_ttl = 10


##################################
#         Caching                #
##################################

## Enable a DNS cache to reduce latency and outgoing traffic
cache = true

## Cache size (number of entries)
cache_size = 4096

## Minimum TTL for cached entries (in seconds)
cache_min_ttl = 7200

## Maximum TTL for cached entries (in seconds)
cache_max_ttl = 86400

## Minimum TTL for negatively cached entries (NXDOMAIN, NODATA) in seconds
cache_neg_min_ttl = 60

## Maximum TTL for negatively cached entries (in seconds)
cache_neg_max_ttl = 600


##################################
#       TLS & Privacy            #
##################################

## Disable TLS session tickets - increases privacy but might also
## increase latency
# tls_disable_session_tickets = false

## Minimum TLS version: '1.0' (default), '1.1', '1.2', '1.3'
# tls_min_version = '1.2'

## List of TLS cipher suites (optional, leave commented for auto)
# tls_cipher_suite = [52392, 49199]


##################################
#      Certificate Settings      #
##################################

## Delay, in minutes, after which certificates are reloaded
cert_refresh_delay = 240

## DNSCrypt: Create a new, unique key for every single DNS query
## This may improve privacy but can also have a significant impact on CPU usage
## Only enable if you don't have a lot of network load
# dnscrypt_ephemeral_keys = false

## DoH: Disable TLS session resumption, in order to improve privacy
# tls_disable_session_tickets = false


##################################
#     Anonymized DNS (Relays)    #
##################################

## Routes are indirect ways to reach DNSCrypt servers.
## A route maps a server name ("server_name") to one or more relays that will be
## used to connect to that server.
##
## Carefully choose relays and servers so that they are run by different entities.
##
## "server_name" can also be set to "*" to define a default route, for all servers
## that don't have a specific route.
##
## If a route is not defined for a server, and no default route either, the server
## will be used directly.

# [anonymized_dns]

## Skip resolvers incompatible with anonymization instead of using them directly
# skip_incompatible = false

## Example relay configuration
# [anonymized_dns.routes]
# [anonymized_dns.routes.example-route]
# server_name = 'sdns://...'
# via = ['anon-relay-1', 'anon-relay-2']


##################################
#        DNS64 Support           #
##################################

## DNS64 is a mechanism for synthesizing AAAA records from A records.
## It is used with NAT64 to allow IPv6-only clients to access IPv4-only resources.

# [dns64]
# prefix = '64:ff9b::/96'


##################################
#        Query Logging           #
##################################

## Log client queries to a file
## The value specified for format should be 'tsv' or 'ltsv'

# [query_log]
# file = 'query.log'
# format = 'tsv'
# ignored_qtypes = ['DNSKEY', 'NS']


##################################
#        NX Log                  #
##################################

## Log queries for nonexistent zones
## These queries can reveal the presence of malware, misconfigured servers,
## or roaming devices.

# [nx_log]
# file = 'nx.log'
# format = 'tsv'


##################################
#      Blocked Names             #
##################################

## Block domains matching patterns from a file

# [blocked_names]
# blocked_names_file = 'blocked-names.txt'
# log_file = 'blocked-names.log'
# log_format = 'tsv'


##################################
#      Blocked IPs               #
##################################

## Block responses containing IP addresses from a file

# [blocked_ips]
# blocked_ips_file = 'blocked-ips.txt'
# log_file = 'blocked-ips.log'
# log_format = 'tsv'


##################################
#      Allowed Names             #
##################################

## Whitelist domains matching patterns from a file
## Whitelisted domains are never blocked

# [allowed_names]
# allowed_names_file = 'allowed-names.txt'
# log_file = 'allowed-names.log'
# log_format = 'tsv'


##################################
#      Allowed IPs               #
##################################

## Whitelist IP addresses
## Whitelisted IPs are never blocked

# [allowed_ips]
# allowed_ips_file = 'allowed-ips.txt'
# log_file = 'allowed-ips.log'
# log_format = 'tsv'


##################################
#      Forwarding Rules          #
##################################

## Conditional forwarding: forward queries for specific domains to specific servers
## This is useful for accessing internal DNS servers for specific domains

# [forwarding_rules]
# forwarding_rules_file = 'forwarding-rules.txt'


##################################
#      Cloaking Rules            #
##################################

## Cloaking returns a predefined address for a specific name.
## In addition to acting as a HOSTS file, it can also return the IP address
## of a different name. It will also do CNAME flattening.

# [cloaking_rules]
# cloaking_rules_file = 'cloaking-rules.txt'
# cloak_ptr = false


##################################
#      Local DoH Server          #
##################################

## Expose a local DoH server endpoint
## This allows other devices to use the proxy as a DoH server

# [local_doh]
# listen_addresses = ['127.0.0.1:3000']
# path = '/dns-query'
# cert_file = 'localhost.pem'
# cert_key_file = 'localhost.pem'


##################################
#      Sources Configuration     #
##################################

## Remote lists of available servers
## Multiple sources can be used simultaneously, but every source
## requires a dedicated cache file.

[sources]

## Main public resolver list
[sources.public-resolvers]
urls = [
  'https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/public-resolvers.md',
  'https://download.dnscrypt.info/resolvers-list/v3/public-resolvers.md',
]
cache_file = 'public-resolvers.md'
minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
refresh_delay = 73
prefix = ''

## Anonymized DNS relays list
[sources.relays]
urls = [
  'https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/relays.md',
  'https://download.dnscrypt.info/resolvers-list/v3/relays.md',
]
cache_file = 'relays.md'
minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
refresh_delay = 73
prefix = ''

